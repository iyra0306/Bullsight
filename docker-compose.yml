version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bullsight-postgres
    restart: always
    environment:
      POSTGRES_USER: bullsight
      POSTGRES_PASSWORD: bullsight_secure_password
      POSTGRES_DB: bullsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bullsight-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=postgresql://bullsight:bullsight_secure_password@postgres:5432/bullsight_db
      - NEWS_API_KEY=${NEWS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bullsight-gateway
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - PYTHON_SERVICE_URL=http://backend:8000
      - DATABASE_PATH=/app/bullsight.db
    ports:
      - "5000:5000"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bullsight-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
